  <text x="380" y="312" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">2. Power BI Report</text>
  <text x="380" y="336" text-anchor="middle" fill="#FDE047" font-size="12">Power_BI_Report.py</text>

  <line x1="485" y1="320" x2="555" y2="320" stroke="#EAB308" stroke-width="2.2" marker-end="url(#arrowYellow)"/>

  <rect x="565" y="275" width="250" height="90" rx="10" fill="#0F172A" stroke="#EAB308" stroke-width="2"/>
  <text x="690" y="312" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">Microsoft Fabric / PBI</text>
  <text x="690" y="336" text-anchor="middle" fill="#CBD5E1" font-size="12">Hosted Report Service</text>

  <line x1="815" y1="320" x2="885" y2="320" stroke="#EAB308" stroke-width="2.2" marker-end="url(#arrowYellow)"/>

  <rect x="895" y="275" width="260" height="90" rx="10" fill="#1E293B" stroke="#EAB308" stroke-width="2"/>
  <text x="1025" y="312" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">HTML iframe Integration</text>
  <text x="1025" y="336" text-anchor="middle" fill="#CBD5E1" font-size="12">Multi-Tab Embedded Views</text>

  <line x1="1155" y1="320" x2="1215" y2="320" stroke="#EAB308" stroke-width="2.2" marker-end="url(#arrowYellow)"/>

  <rect x="1225" y="275" width="240" height="90" rx="10" fill="#0F172A" stroke="#EAB308" stroke-width="2"/>
  <text x="1345" y="312" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">Executive Dashboard</text>
  <text x="1345" y="336" text-anchor="middle" fill="#FDE047" font-size="12">KPIs &amp; Drill-Down Slicing</text>

