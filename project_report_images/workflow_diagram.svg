  <text x="690" y="466" text-anchor="middle" fill="#CBD5E1" font-size="12">time, train_name, division, cause</text>

  <line x1="815" y1="450" x2="885" y2="450" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

