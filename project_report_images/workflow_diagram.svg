  <text x="1025" y="436" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">Feature Engineering</text>
  <text x="1025" y="458" text-anchor="middle" fill="#CBD5E1" font-size="11.5">Derives Hour, Daytime, Season,</text>
  <text x="1025" y="476" text-anchor="middle" fill="#CBD5E1" font-size="11.5">Region &amp; Train Type</text>

  <line x1="1155" y1="450" x2="1215" y2="450" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

  <rect x="1225" y="405" width="240" height="90" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
  <text x="1345" y="442" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">Diagnostic EDA Charts</text>
  <text x="1345" y="466" text-anchor="middle" fill="#7DD3FC" font-size="12">Seaborn Cause &amp; Casualty Plots</text>

