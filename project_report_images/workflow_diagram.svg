  <rect x="275" y="535" width="210" height="90" rx="10" fill="#1E293B" stroke="#A855F7" stroke-width="2"/>
  <text x="380" y="572" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">4. Predictive Model</text>
  <text x="380" y="596" text-anchor="middle" fill="#D8B4FE" font-size="12">Predictive_Model.py</text>

  <line x1="485" y1="580" x2="555" y2="580" stroke="#A855F7" stroke-width="2.2" marker-end="url(#arrowPurple)"/>

  <rect x="565" y="535" width="250" height="90" rx="10" fill="#0F172A" stroke="#A855F7" stroke-width="2"/>
  <text x="690" y="566" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">User CSV Upload + Inputs</text>
  <text x="690" y="588" text-anchor="middle" fill="#CBD5E1" font-size="11.5">Accident Type, Deaths,</text>
  <text x="690" y="606" text-anchor="middle" fill="#CBD5E1" font-size="11.5">Injuries, Rescue Time (hrs)</text>

  <line x1="815" y1="580" x2="885" y2="580" stroke="#A855F7" stroke-width="2.2" marker-end="url(#arrowPurple)"/>

  <rect x="895" y="535" width="260" height="90" rx="10" fill="#1E293B" stroke="#A855F7" stroke-width="2"/>
  <text x="1025" y="566" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">Sklearn Pipeline + RF</text>
  <text x="1025" y="588" text-anchor="middle" fill="#CBD5E1" font-size="11.5">Impute, Scale, OneHot +</text>
  <text x="1025" y="606" text-anchor="middle" fill="#CBD5E1" font-size="11.5">RandomForestRegressor (MAE/R²)</text>

  <line x1="1155" y1="580" x2="1215" y2="580" stroke="#A855F7" stroke-width="2.2" marker-end="url(#arrowPurple)"/>

  <rect x="1225" y="535" width="240" height="90" rx="10" fill="#0F172A" stroke="#A855F7" stroke-width="2"/>
  <text x="1345" y="566" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">Severity &amp; Resources</text>
  <text x="1345" y="588" text-anchor="middle" fill="#D8B4FE" font-size="11.5">Severity Level, Ambulances</text>
  <text x="1345" y="606" text-anchor="middle" fill="#D8B4FE" font-size="11.5">&amp; Damage Cost (INR)</text>

  <!-- ==================== ROW 5: AI ASSISTANT ==================== -->
  <rect x="275" y="665" width="210" height="90" rx="10" fill="#1E293B" stroke="#F43F5E" stroke-width="2"/>
  <text x="380" y="702" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">5. AI Assistant</text>
  <text x="380" y="726" text-anchor="middle" fill="#FDA4AF" font-size="12">llama_Assitant.py</text>

  <line x1="485" y1="710" x2="555" y2="710" stroke="#F43F5E" stroke-width="2.2" marker-end="url(#arrowRose)"/>

  <rect x="565" y="665" width="250" height="90" rx="10" fill="#0F172A" stroke="#F43F5E" stroke-width="2"/>
  <text x="690" y="702" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">Natural-Language Query</text>
  <text x="690" y="726" text-anchor="middle" fill="#CBD5E1" font-size="12">+ st.secrets["GROQ_API_KEY"]</text>

  <line x1="815" y1="710" x2="885" y2="710" stroke="#F43F5E" stroke-width="2.2" marker-end="url(#arrowRose)"/>

  <rect x="895" y="665" width="260" height="90" rx="10" fill="#1E293B" stroke="#F43F5E" stroke-width="2"/>
  <text x="1025" y="702" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">Groq Cloud LLM API</text>
  <text x="1025" y="726" text-anchor="middle" fill="#CBD5E1" font-size="12">openai/gpt-oss-120b (~1s Latency)</text>

  <line x1="1155" y1="710" x2="1215" y2="710" stroke="#F43F5E" stroke-width="2.2" marker-end="url(#arrowRose)"/>

  <rect x="1225" y="665" width="240" height="90" rx="10" fill="#0F172A" stroke="#F43F5E" stroke-width="2"/>
  <text x="1345" y="702" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">Conversational Q&amp;A</text>
  <text x="1345" y="726" text-anchor="middle" fill="#FDA4AF" font-size="12">Railway Safety &amp; History Answers</text>

  <!-- Footer Summary Bar -->
  <text x="750" y="805" text-anchor="middle" fill="#94A3B8" font-size="13">
    Descriptive Analytics (Home, Power BI)   |   Diagnostic Analytics (Insights &amp; EDA)   |   Predictive &amp; Prescriptive ML (Random Forest + Cost/Ambulance Formulas)   |   Conversational AI (Groq 120B)
  </text>
</svg>
